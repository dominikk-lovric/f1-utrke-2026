<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>F1 2026 Races – Data Table</title>
        <meta
            name="description"
            content="Rezultati utrka Formule 1 u sezoni 2026."
        />

        <meta name="author" content="Dominik Lovrić" />

        <meta name="keywords" content="Formula 1, F1, utrke, staze, vozači" />

        <meta name="language" content="en" />

        <meta name="license" content="CC BY 4.0" />

        <meta name="version" content="1.0" />

        <meta name="encoding" content="UTF-8" />

        <meta name="dataset-format" content="CSV, JSON, PostgreSQL dump" />

        <meta name="date" content="2026-10-28" />
    </head>
    <body>
        <h1>F1 2026 Races</h1>
        <p><a href="index.html">Back to home</a></p>

        <form id="filter">
            <input id="q" type="text" placeholder="Enter value" />
            <select id="field">
                <option value="">All fields (wildcard)</option>
                <option value="season">Season</option>
                <option value="round">Round</option>
                <option value="race">Race</option>
                <option value="race_date">Date</option>
                <option value="laps">Laps</option>
                <option value="circuit">Circuit</option>
                <option value="country">Country</option>
                <option value="length_km">Length (km)</option>
                <option value="p1_driver">1st place driver</option>
                <option value="p1_team">1st place team</option>
                <option value="p2_driver">2nd place driver</option>
                <option value="p2_team">2nd place team</option>
                <option value="p3_driver">3rd place driver</option>
                <option value="p3_team">3rd place team</option>
            </select>
            <button type="submit">Search</button>
        </form>

        <p>
            <a id="dl-csv" href="#">Download CSV</a> |
            <a id="dl-json" href="#">Download JSON</a>
        </p>

        <table border="1">
            <thead></thead>
            <tbody></tbody>
        </table>
        <script src="/scripts/load_table.js"></script>
    </body>
</html>
